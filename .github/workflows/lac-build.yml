name: LAC XAPK Inspector

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download XAPK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p input
          gh release download v1.0-base \
            --pattern '*.xapk' \
            --dir input
          ls -lh input

      - name: Extract XAPK
        run: |
          mkdir -p work/xapk
          XAPK=$(find input -name "*.xapk" | head -n 1)
          echo "XAPK=$XAPK"
          unzip -q "$XAPK" -d work/xapk
          find work/xapk -type f | tee work/xapk-files.txt

      - name: Extract OBB
        run: |
          OBB=$(find work/xapk -name "*.obb" | head -n 1)
          echo "OBB=$OBB"

          if [ -z "$OBB" ]; then
            echo "OBB NOT FOUND"
            exit 1
          fi

          mkdir -p work/obb
          unzip -l "$OBB" | tee work/obb-report.txt
          unzip -q "$OBB" -d work/obb

          echo "===== FILES =====" | tee work/vehicle-search.txt
          find work/obb -type f | tee -a work/vehicle-search.txt

      - name: Install UnityPy
        run: |
          python -m pip install --upgrade pip
          pip install UnityPy

      - name: Scan Unity objects
        run: |
          python - <<'PY'
          import os
          import UnityPy

          target = "work/obb/assets/bin/Data/data.unity3d"
          output = "work/unity-objects.txt"

          keywords = (
              "car",
              "vehicle",
              "wheel",
              "tire",
              "tyre",
              "engine",
              "motor",
              "drive",
              "steer",
              "sedan",
              "truck",
              "bike",
              "animation",
              "animator"
          )

          print("Scanning:", target)

          if not os.path.exists(target):
              print("data.unity3d NOT FOUND")

              for root, dirs, files in os.walk("work/obb"):
                  for f in files:
                      print(os.path.join(root, f))

              raise SystemExit(1)

          env = UnityPy.load(target)

          total = 0
          matches = 0

          with open(output, "w", encoding="utf-8") as out:

              for obj in env.objects:
                  total += 1

                  try:
                      data = obj.read()
                      obj_type = obj.type.name
                      name = getattr(data, "m_Name", "") or ""

                      line = f"{obj_type}: {name}"
                      out.write(line + "\n")

                      low = name.lower()

                      if any(k in low for k in keywords):
                          matches += 1
                          print("MATCH:", line)

                  except Exception as e:
                      pass

              out.write("\n")
              out.write(f"TOTAL OBJECTS: {total}\n")
              out.write(f"KEYWORD MATCHES: {matches}\n")

          print("Total objects:", total)
          print("Matches:", matches)
          PY

      - name: Filter vehicle objects
        run: |
          grep -Ei \
          "car|vehicle|wheel|tire|tyre|engine|motor|drive|steer|sedan|truck|bike|animation|animator" \
          work/unity-objects.txt \
          > work/vehicle-objects.txt || true

          echo "===== VEHICLE MATCHES ====="
          cat work/vehicle-objects.txt || true

      - name: Mercedes model check
        run: |
          ls -lh MercedesW201/Models/1982_mercedes_w201.glb

      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: LAC-Unity-Deep-Inspection
          path: |
            work/xapk-files.txt
            work/obb-report.txt
            work/vehicle-search.txt
            work/unity-objects.txt
            work/vehicle-objects.txt
